<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare HMS - Hospital Management System</title>
    <script>
      // Set the theme class before first paint, so there's no light-mode
      // flash for users who prefer dark. Mirrors ThemeContext's logic --
      // keep the two in sync if you change one.
      (function () {
        try {
          var stored = localStorage.getItem('hms:theme');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
